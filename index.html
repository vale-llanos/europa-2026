<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europa 2026 · Valeria</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2028;
    --surface-2: #232a35;
    --border: #2d3441;
    --text: #e8ecf1;
    --text-dim: #9aa4b2;
    --accent: #ff7849;
    --accent-soft: #ff784920;
    --work: #f7c948;
    --vacation: #46c47c;
    --food: #ec407a;
    --tourism: #5db8ff;
    --transport: #b388ff;
    --rest: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #1a2028 0%, #0f1419 100%);
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  header .sub {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 24px;
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    padding: 10px 16px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--accent);
    color: white;
  }
  .tab:hover:not(.active) {
    color: var(--text);
    background: var(--surface-2);
  }
  #map {
    height: 360px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
    background: var(--surface);
  }
  .city-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .city-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .city-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .city-card .num {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 600;
  }
  .city-card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .city-card .dates {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .city-card .stats {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stat-pill {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--text-dim);
  }
  .stat-pill.budget { color: var(--accent); background: var(--accent-soft); }
  .stat-pill.work { color: var(--work); background: #f7c94815; }
  .stat-pill.vacation { color: var(--vacation); background: #46c47c15; }

  /* Timeline view */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }
  .filter-btn {
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .filter-btn:hover:not(.active) {
    color: var(--text);
  }
  .back-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .back-btn:hover { background: var(--surface); }

  .day-group {
    margin-bottom: 24px;
  }
  .day-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 3px solid var(--accent);
  }
  .day-header .date {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .day-header .dayname {
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .day-header .vac-badge {
    margin-left: auto;
    background: var(--vacation);
    color: #0f1419;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .activity {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 6px;
  }
  .activity.work {
    border-left-color: var(--work);
    background: #f7c94808;
  }
  .activity.food { border-left-color: var(--food); }
  .activity.tourism { border-left-color: var(--tourism); }
  .activity.transport { border-left-color: var(--transport); }
  .activity.rest { border-left-color: var(--rest); }

  .activity-head {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .time {
    color: var(--accent);
    font-weight: 600;
    font-size: 0.85rem;
    min-width: 110px;
  }
  .activity.work .time { color: var(--work); }
  .title {
    flex: 1;
    font-weight: 500;
    min-width: 200px;
  }
  .activity-meta {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .meta-item { display: flex; align-items: center; gap: 4px; }
  .cat-pill {
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .notes {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 0.85rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* Summary view */
  .summary-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .summary-section h2 {
    font-size: 1.1rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: var(--text-dim); }
  .summary-row .value { font-weight: 600; }
  .vacation-day {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid var(--vacation);
  }
  .vacation-day .date { font-weight: 700; min-width: 90px; }
  .vacation-day .city { color: var(--text-dim); font-size: 0.9rem; }

  .hidden { display: none; }

  @media (max-width: 640px) {
    .container { padding: 12px; }
    header { padding: 16px 12px; }
    .city-grid { grid-template-columns: 1fr; }
    #map { height: 280px; }
    .time { min-width: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>🌍 Europa 2026 · Valeria</h1>
    <div class="sub">25 julio (Bogotá) → 20 agosto (Madrid)</div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-view="home">🏙️ Ciudades</button>
    <button class="tab" data-view="timeline">📅 Cronología</button>
    <button class="tab" data-view="summary">✨ Resumen</button>
  </div>

  <!-- HOME VIEW: map + city cards -->
  <div id="view-home">
    <div id="map"></div>
    <div class="city-grid" id="cityGrid"></div>
  </div>

  <!-- TIMELINE VIEW: day by day -->
  <div id="view-timeline" class="hidden">
    <button class="back-btn hidden" id="backBtn">← Todas las ciudades</button>
    <div class="toolbar">
      <span style="font-size:0.85rem;color:var(--text-dim);margin-right:4px;">Filtros:</span>
      <button class="filter-btn active" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="tourism">🏛️ Turismo</button>
      <button class="filter-btn" data-filter="food">🍽️ Comida</button>
      <button class="filter-btn" data-filter="work">💻 Trabajo</button>
      <button class="filter-btn" data-filter="transport">🚆 Transporte</button>
      <button class="filter-btn" data-filter="rest">😴 Descanso</button>
    </div>
    <div id="timeline"></div>
  </div>

  <!-- SUMMARY VIEW: budget + vacations -->
  <div id="view-summary" class="hidden">
    <div class="summary-section">
      <h2>💰 Presupuesto por ciudad</h2>
      <div id="budgetList"></div>
    </div>
    <div class="summary-section">
      <h2>🏖️ Días de vacaciones</h2>
      <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:12px;">Días marcados como vacaciones (sin trabajo remoto):</p>
      <div id="vacationList"></div>
    </div>
    <div class="summary-section">
      <h2>💻 Bloques de trabajo remoto</h2>
      <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:12px;">Horarios marcados como trabajo (3pm-7pm COL aprox):</p>
      <div id="workList"></div>
    </div>
  </div>
</div>

// State
let currentView = 'home';
let currentCity = null;
let currentFilter = 'all';
let map = null;
let cityMarkers = {};

// Category classification
function classifyCategory(cat) {
  const c = (cat || '').toUpperCase();
  if (c.includes('TRABAJO')) return 'work';
  if (c.includes('COMIDA') || c.includes('MERCADO') || c.includes('NIGHTLIFE')) return 'food';
  if (c.includes('TURISMO') || c.includes('ARTE') || c.includes('MUSEO') || c.includes('ARQUITECTURA') || c.includes('HISTÓRICO') || c.includes('PARQUE') || c.includes('FÚTBOL') || c.includes('SHOPPING') || c.includes('VINTAGE') || c.includes('NATURA')) return 'tourism';
  if (c.includes('TRANSPORTE') || c.includes('LOGÍSTICA') || c.includes('LOGISTICA')) return 'transport';
  if (c.includes('DESCANSO') || c.includes('DORMIR')) return 'rest';
  return 'rest';
}

function categoryEmoji(type) {
  return {work: '💻', food: '🍽️', tourism: '🏛️', transport: '🚆', rest: '😴'}[type] || '📍';
}

// === HOME VIEW ===
function renderHome() {
  renderMap();
  renderCityGrid();
}

function renderMap() {
  if (map) { map.remove(); }
  map = L.map('map', { scrollWheelZoom: false }).setView([46, 5], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  const path = [];
  DATA.cityOrder.forEach((city, idx) => {
    const coords = DATA.cityCoords[city];
    if (!coords) return;
    path.push(coords);
    const marker = L.marker(coords, {
      icon: L.divIcon({
        className: 'city-marker',
        html: `<div style="background:#ff7849;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;border:2px solid #0f1419;box-shadow:0 2px 8px rgba(0,0,0,0.5);">${idx+1}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      })
    }).addTo(map);
    marker.bindPopup(`<b>${city}</b><br>Parada ${idx+1}`);
    marker.on('click', () => openCity(city));
    cityMarkers[city] = marker;
  });

  // Draw route line
  L.polyline(path, { color: '#ff7849', weight: 2, opacity: 0.6, dashArray: '6,8' }).addTo(map);
  map.fitBounds(path, { padding: [30, 30] });
}

function renderCityGrid() {
  const grid = document.getElementById('cityGrid');
  grid.innerHTML = '';
  DATA.cityOrder.forEach((city, idx) => {
    const items = DATA.records.filter(r => r.ciudad === city);
    const dates = [...new Set(items.map(r => r.fecha))];
    const budget = items.reduce((s, r) => s + (r.presupuesto || 0), 0);
    const workCount = items.filter(r => classifyCategory(r.categoria) === 'work').length;
    const vacationCount = new Set(items.filter(r => r.vacaciones === 'Si').map(r => r.fecha)).size;

    const card = document.createElement('div');
    card.className = 'city-card';
    card.innerHTML = `
      <div class="num">#${idx+1}</div>
      <h3>${city}</h3>
      <div class="dates">${dates.length} día${dates.length>1?'s':''} · ${dates[0]} → ${dates[dates.length-1]}</div>
      <div class="stats">
        <span class="stat-pill budget">€${budget.toFixed(0)}</span>
        ${workCount ? `<span class="stat-pill work">${workCount} trabajo</span>` : ''}
        ${vacationCount ? `<span class="stat-pill vacation">${vacationCount} vacaciones</span>` : ''}
      </div>
    `;
    card.onclick = () => openCity(city);
    grid.appendChild(card);
  });
}

function openCity(city) {
  currentCity = city;
  switchView('timeline');
  document.getElementById('backBtn').classList.remove('hidden');
  renderTimeline();
}

// === TIMELINE VIEW ===
function renderTimeline() {
  const container = document.getElementById('timeline');
  let records = currentCity
    ? DATA.records.filter(r => r.ciudad === currentCity)
    : DATA.records;

  if (currentFilter !== 'all') {
    records = records.filter(r => classifyCategory(r.categoria) === currentFilter);
  }

  // Group by date preserving order
  const groups = [];
  const groupMap = {};
  records.forEach(r => {
    if (!groupMap[r.fecha]) {
      groupMap[r.fecha] = { fecha: r.fecha, dia: r.dia, items: [], isVacation: false };
      groups.push(groupMap[r.fecha]);
    }
    groupMap[r.fecha].items.push(r);
    if (r.vacaciones === 'Si') groupMap[r.fecha].isVacation = true;
  });

  container.innerHTML = '';

  if (currentCity) {
    const heading = document.createElement('h2');
    heading.style.cssText = 'font-size:1.4rem;margin-bottom:16px;';
    heading.textContent = `${currentCity}`;
    container.appendChild(heading);
  }

  if (groups.length === 0) {
    container.innerHTML += '<p style="color:var(--text-dim);padding:20px;text-align:center;">No hay actividades con este filtro.</p>';
    return;
  }

  groups.forEach(g => {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'day-group';
    dayDiv.innerHTML = `
      <div class="day-header">
        <span class="date">${g.fecha}</span>
        <span class="dayname">${g.dia || ''}</span>
        ${g.isVacation ? '<span class="vac-badge">VACACIONES</span>' : ''}
      </div>
    `;
    g.items.forEach(it => {
      const type = classifyCategory(it.categoria);
      const div = document.createElement('div');
      div.className = `activity ${type}`;
      div.innerHTML = `
        <div class="activity-head">
          <div class="time">${it.horario || ''}</div>
          <div class="title">
            ${categoryEmoji(type)} ${it.actividad}
            ${!currentCity ? `<div style="font-size:0.75rem;color:var(--text-dim);margin-top:2px;">${it.ciudad}</div>` : ''}
          </div>
          <span class="cat-pill">${it.categoria}</span>
        </div>
        <div class="activity-meta">
          ${it.transporte && it.transporte !== '-' ? `<span class="meta-item">🚶 ${it.transporte}</span>` : ''}
          ${it.tiempo && it.tiempo !== '-' ? `<span class="meta-item">⏱️ ${it.tiempo}</span>` : ''}
          ${it.presupuesto > 0 ? `<span class="meta-item" style="color:var(--accent);font-weight:600;">€${it.presupuesto.toFixed(0)}</span>` : ''}
        </div>
        ${it.notas ? `<div class="notes">💡 ${it.notas}</div>` : ''}
      `;
      dayDiv.appendChild(div);
    });
    container.appendChild(dayDiv);
  });
}

// === SUMMARY VIEW ===
function renderSummary() {
  // Budget by city
  const budgetList = document.getElementById('budgetList');
  budgetList.innerHTML = '';
  let total = 0;
  DATA.cityOrder.forEach(city => {
    const sum = DATA.records.filter(r => r.ciudad === city).reduce((s, r) => s + r.presupuesto, 0);
    total += sum;
    budgetList.innerHTML += `<div class="summary-row"><span class="label">${city}</span><span class="value">€${sum.toFixed(0)}</span></div>`;
  });
  // Add transit costs from Vuelo + Bus
  const transitSum = DATA.records.filter(r => r.ciudad === 'Vuelo' || r.ciudad === 'Bus').reduce((s, r) => s + r.presupuesto, 0);
  total += transitSum;
  if (transitSum > 0) {
    budgetList.innerHTML += `<div class="summary-row"><span class="label">Tránsito (vuelos/bus)</span><span class="value">€${transitSum.toFixed(0)}</span></div>`;
  }
  budgetList.innerHTML += `<div class="summary-row" style="margin-top:8px;padding-top:12px;border-top:2px solid var(--accent);"><span class="label" style="color:var(--accent);font-weight:700;">TOTAL ESTIMADO</span><span class="value" style="color:var(--accent);font-size:1.1rem;">€${total.toFixed(0)}</span></div>`;
  budgetList.innerHTML += `<p style="margin-top:10px;font-size:0.75rem;color:var(--text-dim);">Solo incluye costos detallados en notas. No incluye alojamiento, vuelos internacionales no detallados, ni gastos imprevistos.</p>`;

  // Vacation days
  const vacList = document.getElementById('vacationList');
  vacList.innerHTML = '';
  const vacDays = {};
  DATA.records.forEach(r => {
    if (r.vacaciones === 'Si') {
      if (!vacDays[r.fecha]) vacDays[r.fecha] = { dia: r.dia, ciudades: new Set() };
      vacDays[r.fecha].ciudades.add(r.ciudad);
    }
  });
  const vacEntries = Object.entries(vacDays);
  vacEntries.forEach(([fecha, info]) => {
    vacList.innerHTML += `
      <div class="vacation-day">
        <span class="date">${fecha}</span>
        <span class="dayname" style="color:var(--text-dim);font-size:0.85rem;min-width:80px;">${info.dia}</span>
        <span class="city">${[...info.ciudades].join(' · ')}</span>
      </div>
    `;
  });
  vacList.innerHTML += `<p style="margin-top:10px;font-size:0.85rem;color:var(--vacation);font-weight:600;">Total: ${vacEntries.length} días de vacaciones</p>`;

  // Work blocks
  const workList = document.getElementById('workList');
  workList.innerHTML = '';
  const workBlocks = DATA.records.filter(r => classifyCategory(r.categoria) === 'work');
  const workByCity = {};
  workBlocks.forEach(r => {
    if (!workByCity[r.ciudad]) workByCity[r.ciudad] = [];
    workByCity[r.ciudad].push(r);
  });
  Object.entries(workByCity).forEach(([city, blocks]) => {
    workList.innerHTML += `<div class="summary-row"><span class="label">${city}</span><span class="value">${blocks.length} bloque${blocks.length>1?'s':''}</span></div>`;
  });
  workList.innerHTML += `<p style="margin-top:10px;font-size:0.85rem;color:var(--work);font-weight:600;">Total: ${workBlocks.length} bloques de trabajo remoto</p>`;
}

// === NAVIGATION ===
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
  document.getElementById('view-home').classList.toggle('hidden', view !== 'home');
  document.getElementById('view-timeline').classList.toggle('hidden', view !== 'timeline');
  document.getElementById('view-summary').classList.toggle('hidden', view !== 'summary');

  if (view === 'home') {
    currentCity = null;
    document.getElementById('backBtn').classList.add('hidden');
    setTimeout(() => { if (map) map.invalidateSize(); }, 100);
  } else if (view === 'timeline') {
    if (!currentCity) document.getElementById('backBtn').classList.add('hidden');
    renderTimeline();
  } else if (view === 'summary') {
    renderSummary();
  }
}

// === EVENT LISTENERS ===
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    if (t.dataset.view === 'timeline') currentCity = null;
    switchView(t.dataset.view);
  };
});

document.getElementById('backBtn').onclick = () => {
  currentCity = null;
  switchView('home');
};

document.querySelectorAll('.filter-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.filter;
    renderTimeline();
  };
});

// Init
renderHome();
</script>
